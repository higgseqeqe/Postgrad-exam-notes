<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表格作用</title>
</head>
<body>
    <h2>表格</h2>
    <p>表格作用：以结构化方式展示行列数据，使信息清晰，易读且便于对比<br>
    网页场景：主要用于数据展示和后台展示</p>
    <p><strong>表格的基本组成</strong></p>
    <table border="1">
        <tr>
            <th>标签</th>
            <th>作用</th>
        </tr>
        <tr>
            <td>table</td>
            <td>表格容器标签</td>
        </tr>
        <tr>
            <td>tr</td>
            <td>行标签</td>
        </tr>
        <tr>
            <td>td</td>
            <td>单元标签格</td>
        </tr>
        <tr>
            <td>th</td>
            <td>表头单元格</td>
        </tr>
    </table>

    <table border="1">
        <thead>
            <tr>
                <th>标签</th>
                <th>作用</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>thead</td>
                <td>定义表格的头部区域</td>
            </tr>
            <tr>
                <td>tbody</td>
                <td>定义表格的主体内容</td>
            </tr>
            <tr>
                <td>tfoot</td>
                <td>定义表格的底部区域</td>
            </tr>
        </tbody>
        
    </table>
</body>
</html>
