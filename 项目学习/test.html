<!DOCTYPE html> <!-- 文档类型声明，让浏览器使用标准模式解析文档；它不是 HTML 元素 -->
<html lang="zh-CN"> <!-- html 是根元素；lang 指定页面的主要语言 -->
<head> <!-- head 存放文档元数据 -->
    <meta charset="UTF-8"> <!-- 指定字符编码为 UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 视口宽度匹配设备宽度，初始缩放比例为 1 -->
    <title>HTML 文档结构与常用标签</title> <!-- 显示在浏览器标签页上的标题 -->
</head>
<body> <!-- body 存放页面中展示的主要内容 -->
    <h1>HTML 文档结构与常用标签</h1>
    <p>HTML 使用标签描述内容的结构和含义。文档主要由 html、head 和 body 等元素组成。</p>

    <h2>标签的基本写法</h2>
    <p>大多数元素使用开始标签和结束标签，中间放置内容，例如：</p>
    <pre><code>&lt;p&gt;这是一个段落&lt;/p&gt;</code></pre>
    <p>少数元素是空元素（通常称为单标签），例如 meta、img、br 和 hr，不需要结束标签。</p>
    <p>属性写在开始标签中，通常采用“属性名="属性值"”的形式，例如 a 的 href 属性指定链接地址。</p>

    <h2>常用标签示例</h2>
    <p>h1 表示一级标题，p 表示段落，a 表示超链接。</p>
    <a href="https://www.baidu.com">百度</a> <!-- href 指定链接目标 -->
    <hr> <!-- hr 表示内容主题的分隔，浏览器默认显示为水平线 -->
    <img src="HTML文档结构关系图 马会.png" alt="HTML 文档结构关系图"> <!-- src 指定图片路径；alt 提供图片的文字替代说明 -->
</body>
</html>
