<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>列表标签</title>
</head>
<body>
    <h2>列表标签</h2>
    <img src="./img/deceb3f1e212f422256a468eeb0e6204.png" alt="">
    <p><strong>无序列表</strong></p>
    与顺序无关，常用于对齐整齐的模块
    <ul>
        <li>猪爸爸</li>
        <li>猪妈妈</li>
        <li>猪佩奇</li>
        <li>猪乔治</li>
        <li>ul为定义列表的容器</li>
        <li>只能包含li</li>
        <li>可以放其他html元素</li>
    </ul>
    <p><strong>有序列表（了解）</strong></p>
    <ol>
        <li>a</li>
        <li>b</li>
        <li>c</li>
        <li>d</li>
    </ol>
    <p><strong>描述列表</strong></p>
    <dl>
        <dt>pet</dt>
        <dd>猫</dd>
        <dd>狗</dd>
        <dd>蚊子</dd>
        <dd>dl为定义列表的容器</dd>
        <dd>只能包含dt和dd</dd>
        <dd>dt定义被描述术语</dd>
        <dd>通常显示为左对齐和加粗</dd>
        
    </dl>
</body>
</html>
