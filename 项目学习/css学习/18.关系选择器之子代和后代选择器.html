<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关系选择器之子代和后代选择器</title>、
    <style>
        div p{
            color: pink;
        }

        div>span {
            color: plum;
        }
    </style>



</head>
<body>
    <h2>关系选择器</h2>

    <p>关系选择器是通过位置关系来选择目标元素(标签)，可以更精准选择某些元素。常见的有: </p>
    <img src="img/关系选择器.png" alt="关系选择器">
    <p>选择某个元素的后代元素（不限层级，包括子元素，孙元素等）</p>
    <div>
        <p>我是什么颜色？</p>
        
    </div>
    <p>精准定位</p>

    <!-- 子代选择器 -->
    <div>
        <span>我是儿子</span>
        <p>
            <span>
                我是孙子
            </span>
        </p>
    </div>
    <h2>兄弟选择器</h2>

    <img src="img/兄弟选择器.png" alt="兄弟选择器">

    <p>
        +是只选一个
        ~选多个
    </p>

</body>
</html>
