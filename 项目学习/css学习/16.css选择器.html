<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css选择器</title>
</head>
<body>
    <p>css选择器式css规则的第一部分。他是选择html元素的方式</p>
    <p>
        css选择器：选择标签；<br>
        css属性：修改样式<br>
        分类：<br>
        基础选择器<br>
        关系选择器<br>
        分组选择器<br>
        伪类和伪元素<br>
    </p>
    <p><strong>
        基础选择器
    </strong></p>
    <p>类型选择器 ：p <br>
        类型选择器选择某个类型的元素，也称为标签选择器 遵循就近原则
    </p>

    <p>类选择器 ：.box <br>
        类 一般直接 .da 直接取名就是 <br>
        在 html 里面 以class来命名 
        <br>类选择器，实现差异化选择<br>
        类选择器的权重优先级高于类型选择器

    </p>
    <!-- 
    1.类名自定义，不能是中文、纯数字
    2.多个英文单词组成尽量使用-链接
    3.命名有要意义，尽量见名知火
    4.class属性可以有多类名中间用空格隔开 -->
    <p>id选择器：#box</p>
    <p>通配符选择器：*</p>
</body>
</html>
