<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页结构标签和无语义标签</title>
</head>

<body>
    <header>网站结构标签</header>
    <nav>导航栏</nav>
    <main>
        <article>文章相关</article>
        <h2>布局标签</h2>
        <img src="./img/ed42fe7997e4eadb8846b6bd464bacfd.png" alt="">

        <img src="./img/c2a1d6d52b9daeba78e3cc88f3f15667.png" alt="">
        <aside>侧边栏</aside>
    </main>
    <section>区块标签</section>
    <footer>页面页脚</footer>

    <h2>无语义标签</h2>
    <p>div <br>
    1.块级元素:默认独占一行，前后会自动换行。<br>
    2.通常用于布局结构，作为其他元素的容器。<br>
    3.可以包含其他块级或行内元素。<br>
    4.默认没有语义。 </p>

    <p><strong>span</strong></p>
    <p>1.行内元素:不会换行，仅包裹内容的一部分。<br>
    2.用于对文本或行内元素的局部样式或操作。<br>
    3.默认没有语义。</p>
</body>

</html>
