<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 标题和段落</title>
</head>
<body>
    <!-- h1～h6 表示六个级别的标题，数字越小，标题层级越高。 -->
    <div>
        <h1>这是一级标题</h1>
        <h2>这是二级标题</h2>
        <h3>这是三级标题</h3>
        <h4>这是四级标题</h4>
        <h5>这是五级标题</h5>
        <h6>这是六级标题</h6>
    </div>

    <div>
        <h2>段落标签</h2>
        <p>p 标签表示一个段落。文字超出容器宽度时，浏览器通常会自动换行。</p>
        <p>每个段落使用独立的 p 标签。源代码中的普通换行不会直接显示为页面上的换行。</p>
    </div>

    <div>
        <h2>语义化的作用</h2>
        <p>根据内容的含义选择标签：标题用 h1～h6，段落用 p。不要只根据文字大小选择标题标签。</p>
        <ul>
            <li>让代码结构更清晰，便于阅读和维护。</li>
            <li>帮助搜索引擎理解页面内容和层级。</li>
            <li>方便屏幕阅读器等辅助工具识别结构，提高可访问性。</li>
        </ul>
        <p>实际页面中，标题应按内容层级组织，尽量避免跳级；通常使用一个主要的 h1 标题。</p>
    </div>
</body>
</html>
